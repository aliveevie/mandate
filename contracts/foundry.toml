[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
# Osaka spec exposes the P256VERIFY precompile at 0x100 (same address as Monad's RIP-7212 precompile)
# in the local EVM so passkey signatures are verified for real in tests. solc still targets cancun.
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
fs_permissions = [{ access = "read-write", path = "./deployments" }]
invariant = { runs = 64, depth = 32, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
