[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }

[profile.ci]
fuzz = { runs = 2000 }

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
